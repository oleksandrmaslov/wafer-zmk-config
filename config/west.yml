manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Keep the personal fork remote available in case we need to roll back.
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Reworked soft off: hold-to-wake + power both halves off together.
    # Points at the soft-off-plus branch until it is merged to the module's main.
    - name: zmk-soft-off-plus
      remote: oleksandrmaslov
      revision: soft-off-plus
  self:
    path: config
