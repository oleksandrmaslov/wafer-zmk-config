###############################################
# Wafer – ZMK base config template
# All options are commented out by default.
# Remove the leading "#" to enable / change.
###############################################

########## GENERAL / HID  ##########

# Readable name over USB/BLE.
CONFIG_ZMK_KEYBOARD_NAME="Wafer von Alex"

########## BLUETOOTH CORE ##########

# Max paired / simultaneous connections (central only).
# CONFIG_BT_MAX_PAIRED=5
# CONFIG_BT_MAX_CONN=5


# Experimental BLE connection/security tuning.
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Passkey pairing (pair by typing a code on the keyboard).
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Workaround for macOS battery notification bug:
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n


########## POWER MANAGEMENT / IDLE / SLEEP ##########

# Milliseconds of inactivity before entering IDLE state.
# (Lower power comsumption, still fully connected.)
# Example: 60000 = 1 min; 300000 = 5 min.
# CONFIG_ZMK_IDLE_TIMEOUT=60000

# Enable deep sleep (SLEEP state, DEFAULT ON).
# CONFIG_ZMK_SLEEP=y

# Keep both the matrix and dedicated sideband switch armed as wake sources
# when the inactivity timer enters System OFF.
CONFIG_ZMK_SOFT_OFF_PLUS_DEEP_SLEEP_WAKE=y

# Milliseconds of inactivity before entering deep sleep.
# Example: 600000 = 10 min; 1800000 = 30 min.
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000


########## SPLIT BATTERY FETCHING / PROXY (central only) ##########
# For Wafer central side when you want both battery levels.

# Fetch peripheral battery level over BLE.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Report peripheral battery level to OS from central.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

########## DISPLAY (nice!view, OLED etc.) ##########

# The nice!view MONO01 pipeline maps LVGL white to black. Draw the shutdown
# overlay with the inverse LVGL color so it appears white on the panel.
CONFIG_ZMK_SOFT_OFF_PLUS_BLANK_INVERTED=y

# Use built-in status screen (simple default).
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y


########## POINTING / MOUSE (Cirque etc.) ##########

# Enable general pointing/mouse functionality in ZMK.
# CONFIG_ZMK_POINTING=y

# Enable HID smooth scrolling (resolution multipliers).
# (Can feel weird on some OSes – turn off if scroll is too crazy.)
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y


########## BEHAVIORS (HOLD-TAP, MACROS, ETC.) ##########

# Max pending behavior events (hold-taps, macros, combos).
# CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=32

# Hold-tap – how many can be held at once and how many events buffered.
# CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=8
# CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=32

# Default macro timings (can override per-macro).
# CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
# CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=40


########## ZMK STUDIO (CENTRAL ONLY) ##########

# Enable ZMK Studio runtime keymap editing.
# CONFIG_ZMK_STUDIO=y

# Require special unlock key (&studio_unlock) to allow edits.
# (Set n while you’re experimenting, then y for safety.)
# CONFIG_ZMK_STUDIO_LOCKING=n

# Lock Studio as soon as it disconnects.
# CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

# Lower BLE latency while Studio is connected.
# CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=y


########## POWER / RADIO TWEAKS ##########

# Increase TX power for more reliable wireless (uses more battery).
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Stay on 1M PHY by disabling 2M PHY support (applies to host and split
# links). Same PHY effect as ZMK_BLE_EXPERIMENTAL_CONN, without its
# connection-interval and pairing-timing changes.
CONFIG_BT_CTLR_PHY_2M=n

########## ADVANCED / MISC ##########

# Queue size for key scan events (increase if you see lost events).
# CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=4

# Global debounce options (apply to all supported kscan drivers).
# Defaults (if you don’t set anything) are 5 ms press, 5 ms release.

# Faster / lower-latency debouncing:
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# “Eager-ish” debouncing: instant press, debounced release.
# (Very low latency, but less noise-resistant.)
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Slightly safer eager mode (still fast, ignores tiny spikes):
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

########## SPLIT HID DISPLAY ##########

CONFIG_NICE_VIEW_HID=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# Display names for the host layout indices. The host app sends an index into
# its own "layouts" array, so the order here must match qmk-hid-host.json,
# which must use ISO 639-1 language codes: ["en","ru","de","uk"].
CONFIG_NICE_VIEW_HID_LAYOUTS="US,RU,DE,UA"

CONFIG_RAW_HID=y
CONFIG_RAW_HID_REPORT_SIZE=32
CONFIG_RAW_HID_FORWARD_TO_PERIPHERAL=y
CONFIG_RAW_HID_SPLIT_RELAY_CHANNEL=1
CONFIG_ZMK_SPLIT_PERIPHERAL_OUTPUT_MAX_PAYLOAD=64
CONFIG_USB_HID_DEVICE_COUNT=2

CONFIG_WAFER_LS0XX_VCOM_THREAD_PRIO=11


