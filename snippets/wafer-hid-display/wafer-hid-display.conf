# Requires the config/hid-display/west.yml manifest.
CONFIG_NICE_VIEW_HID=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# Names must match the language order sent by the host app (default: ["en"]).
CONFIG_NICE_VIEW_HID_LAYOUTS="US"

CONFIG_RAW_HID=y
CONFIG_RAW_HID_REPORT_SIZE=32
CONFIG_RAW_HID_FORWARD_TO_PERIPHERAL=y
CONFIG_RAW_HID_SPLIT_RELAY_CHANNEL=1
CONFIG_ZMK_SPLIT_PERIPHERAL_OUTPUT_MAX_PAYLOAD=64
CONFIG_USB_HID_DEVICE_COUNT=2
