# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # Main firmware.
  - board: wafer_left
  - board: wafer_right
  # Recovery firmware: wipes all persistent settings (BLE bonds, Studio keymap
  # changes) on every boot. Flash to both halves, let them boot once, then
  # flash the normal firmware again. This is the same mechanism the
  # settings_reset shield enables; the shield itself cannot be stacked on a
  # standalone board like the wafer.
  - board: wafer_left
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y
    artifact-name: wafer_left_settings_reset
  - board: wafer_right
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y
    artifact-name: wafer_right_settings_reset
