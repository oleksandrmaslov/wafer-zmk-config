# Battery reporting via custom nPM1300 VBAT sensor.
# The ZMK NPM1300_VBAT sensor driver triggers a VBAT measurement on the
# PMIC ADC and reports it on SENSOR_CHAN_GAUGE_VOLTAGE in millivolts;
# ZMK then converts to percent through the lithium-voltage curve.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_SENSOR=y
CONFIG_ZMK_NPM1300_VBAT=y
